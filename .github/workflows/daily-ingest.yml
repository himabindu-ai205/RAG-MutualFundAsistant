# Daily corpus refresh — scrape → parse → chunk → embed → Chroma
#
# Schedule: 17:30 Singapore Time (SGT, UTC+8) every day → 09:30 UTC
# Manual: Actions → "Daily ingest" → Run workflow

name: Daily ingest

on:
  schedule:
    # 17:30 SGT == 09:30 UTC
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Scrape → normalize → chunk → embed → Chroma
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        # Node 24 runtime (checkout@v4 was Node 20 — deprecated on Actions runners)
        uses: actions/checkout@v5
        with:
          # Ensure we are on a branch (not detached) so the bot commit can push
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache sentence-transformers / Hugging Face
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-hf-minilm-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-minilm-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build index (full fetch, no --skip-fetch)
        env:
          # Prefer CPU; avoid optional CUDA probes in CI
          CUDA_VISIBLE_DEVICES: ""
        run: python scripts/build_index.py --smoke -v

      - name: Write job summary
        if: always()
        run: python scripts/ingest_job_summary.py

      - name: Upload Chroma index artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chroma-index-${{ github.run_id }}
          path: |
            data/chroma/
            !data/chroma/.gitkeep
          retention-days: 14
          if-no-files-found: error

      - name: Commit refreshed corpus snapshots
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Track daily-refresh outputs (some paths are gitignored locally)
          git add -f \
            docs/corpus/groww/*.html \
            docs/corpus/shared/*.html \
            docs/sources.csv \
            data/chunks.jsonl \
            data/chroma/embed_manifest.json \
            || true

          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
          else
            git commit -m "chore(ingest): daily corpus refresh $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
